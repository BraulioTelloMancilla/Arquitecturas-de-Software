<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${empleado.id == null} ? 'Nuevo empleado' : 'Editar empleado'">Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <section class="card">
                <div class="card-body">
                    <h1 class="h2 card-title mb-4"
                        th:text="${empleado.id == null} ? 'Nuevo empleado' : 'Editar empleado'"></h1>

                    <form th:object="${empleado}" method="post"
                          th:action="${empleado.id == null} ? @{/empleados} : @{/empleados/{id}(id=${empleado.id})}">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" th:field="*{nombre}" maxlength="100"
                                   class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}"
                                 th:errors="*{nombre}"></div>
                        </div>
                        <div class="mb-3">
                            <label for="salario" class="form-label">Salario</label>
                            <div class="input-group has-validation">
                                <span class="input-group-text">$</span>
                                <input type="number" th:field="*{salario}" step="0.01" min="0"
                                       class="form-control" th:errorclass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('salario')}"
                                     th:errors="*{salario}"></div>
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar</button>
                            <a class="btn btn-secondary" th:href="@{/}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
</body>
</html>
