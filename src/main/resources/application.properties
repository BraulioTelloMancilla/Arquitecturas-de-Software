spring.application.name=crud-empleados

# Conexión a MySQL local.
# Cada integrante puede sobrescribir los valores con variables de entorno
# (DB_URL, DB_USER, DB_PASSWORD) sin modificar este archivo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/empleados_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# La tabla se crea con database/schema.sql; Hibernate solo verifica al arrancar
# que las entidades coincidan con ella, sin modificar el esquema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
