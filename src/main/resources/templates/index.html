<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administrar Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/listado.js}" defer></script>
</head>
<body>
<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="h2 mb-0">Administrar Empleados</h1>
        <div class="d-flex gap-2">
            <form id="form-eliminar" th:action="@{/empleados/eliminar-multiple}" method="post">
                <button type="submit" class="btn btn-danger">Eliminar</button>
            </form>
            <a class="btn btn-success" th:href="@{/empleados/nuevo}">Agregar nuevo empleado</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col">
                    <input type="checkbox" class="form-check-input" id="seleccionar-todos"
                           aria-label="Seleccionar todos los empleados">
                </th>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Salario</th>
                <th scope="col">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="empleado : ${empleados}">
                <td>
                    <input type="checkbox" class="form-check-input" name="ids"
                           th:value="${empleado.id}" form="form-eliminar"
                           th:attr="aria-label=|Seleccionar empleado ${empleado.nombre}|">
                </td>
                <td th:text="${empleado.id}"></td>
                <td th:text="${empleado.nombre}"></td>
                <td th:text="'$' + ${#numbers.formatDecimal(empleado.salario, 1, 'COMMA', 2, 'POINT')}"></td>
                <td>
                    <a class="btn btn-sm btn-primary"
                       th:href="@{/empleados/{id}/editar(id=${empleado.id})}">Editar</a>
                    <form class="d-inline"
                          th:action="@{/empleados/{id}/eliminar(id=${empleado.id})}" method="post"
                          onsubmit="return confirm('¿Eliminar este empleado?')">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="5" class="text-center">No hay empleados registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
